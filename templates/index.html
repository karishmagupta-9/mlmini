<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Review Sentiment Classifier</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 60px 16px; display: flex; justify-content: center; }
    .card { background: #ffffff; width: 100%; max-width: 580px; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
    h2 { margin-top: 0; color: #0f172a; font-size: 24px; }
    p.description { color: #64748b; font-size: 14px; margin-top: -6px; margin-bottom: 24px; }
    textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: #2563eb; }
    button { margin-top: 14px; width: 100%; padding: 12px; font-size: 15px; font-weight: 600; background-color: #2563eb; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; transition: background 0.15s ease-in-out; }
    button:hover { background-color: #1d4ed8; }
    .result-container { margin-top: 24px; padding: 16px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; display: none; }
    .badge { display: inline-block; font-weight: 600; padding: 4px 12px; border-radius: 6px; font-size: 14px; }
    .positive { background: #dcfce7; color: #166534; }
    .negative { background: #fee2e2; color: #991b1b; }
    .neutral { background: #fef3c7; color: #92400e; }
    .meta { margin-top: 8px; font-size: 14px; color: #475569; }
  </style>
</head>
<body>

<div class="card">
  <h2>Review Sentiment Classifier</h2>
  <p class="description">Analyze Amazon food reviews using Logistic Regression &amp; TF-IDF.</p>

  <textarea id="reviewInput" placeholder="Enter review here (e.g., 'The snack was fresh, crispy, and delicious. Will order again!')."></textarea>
  <button id="submitBtn" onclick="sendReview()">Analyze Text</button>

  <div id="outputCard" class="result-container">
    <div><strong>Detected Sentiment:</strong> <span id="badgeTarget" class="badge"></span></div>
    <div class="meta"><strong>Confidence:</strong> <span id="confTarget"></span></div>
  </div>
</div>

<script>
  async function sendReview() {
    const input = document.getElementById("reviewInput").value.trim();
    if (!input) {
      alert("Please provide review text.");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.textContent = "Analyzing...";
    btn.disabled = true;

    try {
      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ review: input })
      });
      const res = await response.json();

      if (res.error) {
        alert(res.error);
        return;
      }

      const out = document.getElementById("outputCard");
      const badge = document.getElementById("badgeTarget");
      const conf = document.getElementById("confTarget");

      out.style.display = "block";
      badge.textContent = res.sentiment;
      badge.className = "badge " + res.sentiment.toLowerCase();
      conf.textContent = res.confidence;
    } catch (err) {
      alert("Failed to connect to the backend server.");
    } finally {
      btn.textContent = "Analyze Text";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
